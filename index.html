<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlWPLE4kqIqz-2zXYskTzF7Ad_jEM7MVQ",
  authDomain: "maawebsite-76702.firebaseapp.com",
  projectId: "maawebsite-76702",
  storageBucket: "maawebsite-76702.firebasestorage.app",
  messagingSenderId: "969050455058",
  appId: "1:969050455058:web:330a027f5de17974102ccb",
  measurementId: "G-57W3CBN94Y"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.login = async function() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    alert("로그인 성공");
  } catch (error) {
    alert(error.message);
  }
};

onAuthStateChanged(auth, async (user) => {

  if (!user) return;

  const docRef = doc(db, "students", user.email);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {

    const data = docSnap.data();

    document.getElementById("userInfo").innerHTML = `
      <h2>Welcome ${data.name}</h2>
      <p><b>Program:</b> ${data.program}</p>
      <p><b>Flight Hours:</b> ${data.flightHours}</p>
      <p><b>Instructor:</b> ${data.instructor}</p>
      <p><b>Next Flight:</b> ${data.nextFlight}</p>
      <br>
      <button onclick="logout()">Logout</button>
    `;
  } else {
    alert("학생 데이터를 찾을 수 없습니다.");
  }
});

window.logout = async function() {
  await signOut(auth);
};

</script>
