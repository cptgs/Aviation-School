<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mongolian Aviation Academy</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#0a1f44;
  color:white;
  text-align:center;
  padding-top:50px;
}
input{
  width:250px;
  padding:10px;
  margin:10px;
}
button{
  padding:10px 20px;
  background:#4da6ff;
  color:white;
  border:none;
  cursor:pointer;
}
#userInfo{
  margin-top:20px;
}
</style>
</head>
<body>

<h1>Mongolian Aviation Academy</h1>

<h2>Student Login</h2>

<input type="email" id="email" placeholder="Email"><br>
<input type="password" id="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

<div id="userInfo"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlWPLE4kqIqz-2zXYskTzF7Ad_jEM7MVQ",
  authDomain: "maawebsite-76702.firebaseapp.com",
  projectId: "maawebsite-76702",
  storageBucket: "maawebsite-76702.firebasestorage.app",
  messagingSenderId: "969050455058",
  appId: "1:969050455058:web:330a027f5de17974102ccb",
  measurementId: "G-57W3CBN94Y"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
window.login = function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("logging");
    })
    .catch((error) => {
      alert(error.message);
    });
};

onAuthStateChanged(auth, async (user) => {

  if(user){

    const docRef = doc(db, "students", user.email);
    const docSnap = await getDoc(docRef);

    if(docSnap.exists()){

      const data = docSnap.data();

      document.getElementById("userInfo").innerHTML = `
        <h2>Welcome ${data.name}</h2>

        <p><b>Program:</b> ${data.program}</p>

        <p><b>Flight Hours:</b> ${data.flightHours}</p>

        <p><b>Instructor:</b> ${data.instructor}</p>

        <p><b>Next Flight:</b> ${data.nextFlight}</p>

        <br>

        <button onclick="logout()">Logout</button>
      `;
    }
  }

window.logout = function(){
  signOut(auth);
};

</script>

</body>
</html>
