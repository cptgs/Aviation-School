<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mongolian Aviation Academy</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#0a1f44;
  color:white;
  text-align:center;
  padding-top:50px;
}
input{
  width:250px;
  padding:10px;
  margin:10px;
}
button{
  padding:10px 20px;
  background:#4da6ff;
  color:white;
  border:none;
  cursor:pointer;
}
#userInfo{
  margin-top:20px;
}
</style>
</head>
<body>

<h1>Mongolian Aviation Academy</h1>

<h2>Student Login</h2>

<input type="email" id="email" placeholder="Email"><br>
<input type="password" id="password" placeholder="Password"><br>

<button onclick="login()">Login</button>

<div id="userInfo"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlWPLE4kqIqz-2zXYskTzF7Ad_jEM7MVQ",
  authDomain: "maawebsite-76702.firebaseapp.com",
  projectId: "maawebsite-76702",
  storageBucket: "maawebsite-76702.firebasestorage.app",
  messagingSenderId: "969050455058",
  appId: "1:969050455058:web:330a027f5de17974102ccb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("로그인 성공");
    })
    .catch((error) => {
      alert(error.message);
    });
};

onAuthStateChanged(auth, (user) => {
  if(user){
    document.getElementById("userInfo").innerHTML =
      `<h3>${user.email}</h3>
       <button onclick="logout()">Logout</button>`;
  }
});

window.logout = function(){
  signOut(auth);
};

</script>

</body>
</html>
